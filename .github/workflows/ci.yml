name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run pytest tests --ignore=tests/test_e2e.py --ignore=tests/test_resource_limits.py -q
        env:
          UV_PYTHON: ${{ matrix.python-version }}
